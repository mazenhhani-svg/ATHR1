<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة أنشاء صنف جديد</title>
  <!-- Google Fonts for Luxury Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: #141419;
      --card-inner: #1a1a22;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa7c11;
      --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --gold-glow: rgba(212, 175, 55, 0.25);
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --border-gold: rgba(212, 175, 55, 0.3);
      --border-focus: rgba(243, 229, 171, 0.8);
      --error-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(20, 20, 25, 0.5) 0%, transparent 50%);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 15px 25px 15px;
    }

    /* Main Container with Glassmorphism & Gold Glow */
    .wrapper {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    /* Header Logo Container Floating on Top */
    .logo-wrapper {
      position: absolute;
      top: -55px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .logo-container {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #0f0f13;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 20px var(--gold-glow), inset 0 0 15px rgba(212, 175, 55, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .logo-container:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(212, 175, 55, 0.3);
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Luxury Card Styling */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 20px;
      padding: 70px 30px 35px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.05);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.8s ease-out forwards;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gold-gradient);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 300;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.3px;
    }

    .input-control {
      width: 100%;
      padding: 13px 16px;
      background: var(--card-inner);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 10px;
      color: var(--text-white);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-control:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 12px var(--gold-glow);
      background: #1e1e27;
    }

    .input-control[readonly] {
      background: rgba(255, 255, 255, 0.03);
      color: var(--gold-primary);
      font-weight: 700;
      cursor: not-allowed;
      border-color: rgba(212, 175, 55, 0.15);
      letter-spacing: 1px;
    }

    /* File Input Custom Design */
    .file-drop-area {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border: 2px dashed rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.015);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .file-drop-area:hover {
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.04);
    }

    .file-drop-area input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      font-size: 1.8rem;
      color: var(--gold-primary);
      margin-bottom: 6px;
    }

    .upload-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Image Preview Styling */
    .preview-container {
      margin-top: 12px;
      text-align: center;
      display: none;
    }

    .preview-image {
      max-width: 100%;
      max-height: 160px;
      border-radius: 10px;
      border: 1px solid var(--gold-primary);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      object-fit: cover;
    }

    /* High-End Gold Animated Button */
    .btn-submit {
      position: relative;
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: var(--gold-gradient);
      border: none;
      border-radius: 10px;
      color: #0a0a0c;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s ease;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent,
        rgba(255, 255, 255, 0.4),
        transparent
      );
      transform: rotate(30deg) translateX(-100%);
      transition: transform 0.6s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
    }

    .btn-submit:hover::before {
      transform: rotate(30deg) translateX(100%);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Status Notifications */
    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      animation: slideDown 0.3s ease-out forwards;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success-color);
      color: #6ee7b7;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error-color);
      color: #fca5a5;
    }

    /* Custom Loading Spinner */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #0a0a0c;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }

    /* Keyframe Animations */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .card {
        padding: 60px 20px 25px 20px;
      }
      .logo-container {
        width: 85px;
        height: 85px;
      }
      .logo-wrapper {
        top: -45px;
      }
      .brand-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

  <div class="card">
    <div class="brand-header">
      <h1 class="brand-title">إضافة صنف ملكي جديد</h1>
      <p class="brand-subtitle">نظام إدارة الأصناف التلقائي لشركات العطور الفاخرة</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="itemForm">
      <!-- كود الصنف التلقائي -->
      <div class="form-group">
        <label for="itemCode">كود الصنف (تلقائي)</label>
        <input type="text" class="input-control" id="itemCode" name="itemCode" readonly placeholder="جاري الاتصال بالنظام...">
      </div>

      <!-- اسم الصنف -->
      <div class="form-group">
        <label for="itemName">اسم الصنف الملكي</label>
        <input type="text" class="input-control" id="itemName" name="itemName" required placeholder="مثال: زيت عطري سترونج وذ يو">
      </div>

      <!-- وحدة القياس مع اقتراحات -->
      <div class="form-group">
        <label for="itemUnit">وحدة القياس</label>
        <input type="text" class="input-control" id="itemUnit" name="itemUnit" list="unitsList" required placeholder="اختر أو اكتب وحدة القياس (مثل: مل، لتر)">
        <datalist id="unitsList"></datalist>
      </div>

      <!-- رفع وصورة الصنف -->
      <div class="form-group">
        <label>صورة الصنف (حد أقصى 5 ميجابايت)</label>
        <div class="file-drop-area">
          <div class="upload-icon">📷</div>
          <div class="upload-text" id="uploadText">اضغط هنا أو اسحب الصورة لرفعها</div>
          <input type="file" id="imageInput" accept="image/*">
        </div>
        <div class="preview-container" id="previewContainer">
          <img id="imagePreview" class="preview-image" alt="معاينة الصورة">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">حفظ الصنف في الجداول</span>
      </button>
    </form>
  </div>
</div>

<script>
  // ==========================================
  // إعدادات الربط بـ API (Google Apps Script Web App)
  // ==========================================
  // ضع هنا رابط الـ Web App الخاص بـ Google Apps Script بعد النشر
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxd4qeyy2ulZ5H6_-2j5aEyYPs6j6VLwojWTIfSuI98qvVJxhOktTuoSFKSOQdTqYeL/exec";

  let compressedBase64Image = null;

  // عند تحميل الصفحة، جلب البيانات الأولية من API
  window.addEventListener('DOMContentLoaded', () => {
    fetchInitialData();
  });

  // 1. جلب البيانات الأولية من Google Script API
  function fetchInitialData() {
    if (GAS_WEB_APP_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
      // وضع بيانات تجريبية في حال لم يتم وضع الرابط بعد
      document.getElementById('itemCode').value = "IT0006";
      setupUnitsDatalist(["مل", "لتر", "وحدة", "جرام", "عبوة"]);
      return;
    }

    fetch(`${GAS_WEB_APP_URL}?action=getInitialData`)
      .then(response => response.json())
      .then(data => {
        if (data.nextCode) {
          document.getElementById('itemCode').value = data.nextCode;
        }
        if (data.units) {
          setupUnitsDatalist(data.units);
        }
      })
      .catch(err => {
        console.error("Fetch initial error:", err);
        showAlert("تعذر الاتصال بقاعدة البيانات لجلب الكود التلقائي", "error");
      });
  }

  function setupUnitsDatalist(units) {
    const datalist = document.getElementById('unitsList');
    datalist.innerHTML = "";
    units.forEach(unit => {
      const option = document.createElement('option');
      option.value = unit;
      datalist.appendChild(option);
    });
  }

  // 2. التحكم ومعالجة ضغط الصور في المتصفح قبل الإرسال
  document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
      showAlert("حجم الملف الأصلي يتجاوز 5 ميجابايت!", "error");
      this.value = "";
      return;
    }

    document.getElementById('uploadText').innerText = `تم اختيار: ${file.name}`;

    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;

      img.onload = function() {
        // ضغط وتعديل أبعاد الصورة للحفاظ على أعلى جودة مع إبقاء الحجم مثاليًا
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1200;
        const MAX_HEIGHT = 1200;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
        } else {
          if (height > MAX_HEIGHT) {
            width *= MAX_HEIGHT / height;
            height = MAX_HEIGHT;
          }
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // الضغط بجودة 80%
        compressedBase64Image = canvas.toDataURL('image/jpeg', 0.8);
        
        // عرض المعاينة
        const preview = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('previewContainer');
        preview.src = compressedBase64Image;
        previewContainer.style.display = 'block';
      };
    };
    reader.readAsDataURL(file);
  });

  // 3. إرسال النموذج إلى Google Script API
  document.getElementById('itemForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    
    submitBtn.disabled = true;
    btnText.innerHTML = 'جاري الحفظ والرفع... <span class="spinner"></span>';

    const formData = {
      itemCode: document.getElementById('itemCode').value,
      itemName: document.getElementById('itemName').value,
      itemUnit: document.getElementById('itemUnit').value,
      imageFile: compressedBase64Image ? { base64: compressedBase64Image } : null
    };

    if (GAS_WEB_APP_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
      setTimeout(() => {
        submitBtn.disabled = false;
        btnText.innerText = 'حفظ الصنف في الجداول';
        showAlert("يرجى وضع رابط Web App الخاص بـ Apps Script أولاً!", "error");
      }, 1000);
      return;
    }

    // الإرسال باستخدام fetch POST
    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify(formData)
    })
    .then(res => res.json())
    .then(res => {
      submitBtn.disabled = false;
      btnText.innerText = 'حفظ الصنف في الجداول';

      if (res.success) {
        showAlert(res.message || "تم إضافة الصنف الملكي بنجاح!", "success");
        document.getElementById('itemForm').reset();
        document.getElementById('previewContainer').style.display = 'none';
        document.getElementById('uploadText').innerText = "اضغط هنا أو اسحب الصورة لرفعها";
        compressedBase64Image = null;
        
        // تحديث البيانات والكود التلقائي
        fetchInitialData();
      } else {
        showAlert("حدث خطأ أثناء الحفظ: " + res.message, "error");
      }
    })
    .catch(err => {
      console.error("Submit Error:", err);
      submitBtn.disabled = false;
      btnText.innerText = 'حفظ الصنف في الجداول';
      showAlert("حدث خطأ في الاتصال بالخادم الرئيسي!", "error");
    });
  });

  function showAlert(msg, type) {
    const alertBox = document.getElementById('alertBox');
    alertBox.innerText = msg;
    alertBox.className = `alert alert-${type}`;
    alertBox.style.display = 'block';
    setTimeout(() => { alertBox.style.display = 'none'; }, 4500);
  }
</script>

</body>
</html>
